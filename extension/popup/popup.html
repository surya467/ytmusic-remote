<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Music Remote</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      width: 330px;
      background-color: #121212;
      color: #ffffff;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #ff0000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 14px;
      height: 14px;
      fill: #ffffff;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    .settings-btn:hover {
      color: #fff;
    }

    /* Status Indicators */
    .status-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #b3b3b3;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #e5a50a;
    }

    .dot.green {
      background-color: #1db954;
      box-shadow: 0 0 6px #1db954;
    }

    .dot.red {
      background-color: #ff3b30;
      box-shadow: 0 0 6px #ff3b30;
    }

    /* QR Code Card */
    .qr-card {
      background: #181818;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }

    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .room-tag {
      font-size: 11px;
      font-weight: 600;
      color: #1db954;
      background: rgba(29, 185, 84, 0.12);
      padding: 3px 8px;
      border-radius: 12px;
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .regen-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .regen-btn:hover {
      color: #fff;
    }

    .qr-canvas-wrapper {
      width: 160px;
      height: 160px;
      margin: 0 auto 10px auto;
      background: #ffffff;
      border-radius: 8px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrCanvas {
      width: 100% !important;
      height: 100% !important;
    }

    .url-box {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      gap: 6px;
    }

    .url-text {
      flex: 1;
      font-size: 11px;
      color: #bbb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Action Buttons */
    .btn-action {
      width: 100%;
      padding: 8px 12px;
      background: #ff0000;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    /* Settings Panel */
    .settings-panel {
      display: none;
      background: #1e1e1e;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
    }

    .settings-label {
      color: #aaa;
      margin-bottom: 6px;
      display: block;
    }

    .settings-input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      color: #fff;
      padding: 6px 8px;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .settings-save-btn {
      background: #1db954;
      border: none;
      color: #000;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      float: right;
    }

    /* Mini player */
    .mini-player {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      margin-top: 10px;
    }

    .mini-thumb {
      width: 38px;
      height: 38px;
      border-radius: 4px;
      object-fit: cover;
      background: #282828;
    }

    .mini-info {
      flex: 1;
      overflow: hidden;
    }

    .mini-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-artist {
      font-size: 11px;
      color: #a0a0a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <polygon points="9,6 18,12 9,18"/>
        </svg>
      </div>
      <div class="header-title">YT Music Remote</div>
    </div>
    <button class="settings-btn" id="settingsToggle" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settingsPanel">
    <label class="settings-label">Hosted Web App URL (GitHub Pages):</label>
    <input type="text" id="webAppUrlInput" class="settings-input" placeholder="https://<user>.github.io/ytmusic-remote">
    <button class="settings-save-btn" id="saveSettingsBtn">Save</button>
    <div style="clear: both;"></div>
  </div>

  <div class="status-container">
    <div class="status-badge">
      <span>Cloud Relay</span>
      <div class="status-indicator">
        <span class="dot" id="cloudDot"></span>
        <span id="cloudStatusText">Connecting...</span>
      </div>
    </div>
    <div class="status-badge">
      <span>YouTube Music Tab</span>
      <div class="status-indicator">
        <span class="dot" id="ytmDot"></span>
        <span id="ytmStatusText">Checking...</span>
      </div>
    </div>
  </div>

  <div class="qr-card">
    <div class="room-header">
      <span class="room-tag" id="roomCodeDisplay">ROOM: ...</span>
      <button class="regen-btn" id="regenBtn" title="Regenerate Room Code">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
        New Code
      </button>
    </div>

    <div class="qr-canvas-wrapper">
      <canvas id="qrCanvas"></canvas>
    </div>

    <div class="url-box">
      <span class="url-text" id="urlText">Loading link...</span>
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>
  </div>

  <button class="btn-action" id="openYtmBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
    </svg>
    Open YouTube Music
  </button>

  <div class="mini-player" id="miniPlayer">
    <img id="miniThumb" class="mini-thumb" src="" alt="">
    <div class="mini-info">
      <div class="mini-title" id="miniTitle">Song Title</div>
      <div class="mini-artist" id="miniArtist">Artist</div>
    </div>
  </div>

  <script src="qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
