<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Music Remote</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      width: 300px;
      background-color: #121212;
      color: #ffffff;
      padding: 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ff0000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 14px;
      height: 14px;
      fill: #ffffff;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    /* Single Status Light at Top */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #ff3b30;
      box-shadow: 0 0 8px #ff3b30;
      transition: all 0.3s ease;
    }

    .status-dot.red {
      background-color: #ff3b30;
      box-shadow: 0 0 10px #ff3b30;
    }

    .status-dot.yellow {
      background-color: #ffcc00;
      box-shadow: 0 0 10px #ffcc00;
    }

    .status-dot.green {
      background-color: #1db954;
      box-shadow: 0 0 10px #1db954;
    }

    /* QR Code Card */
    .qr-card {
      background: #181818;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    .qr-canvas-wrapper {
      width: 170px;
      height: 170px;
      margin: 0 auto 10px auto;
      background: #ffffff;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrCanvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .qr-hint {
      font-size: 12px;
      color: #999;
      font-weight: 500;
    }

    /* Open YouTube Music Button */
    .btn-action {
      width: 100%;
      padding: 10px 14px;
      background: #ff0000;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-action:hover {
      background: #e60000;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    /* Mini player */
    .mini-player {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .mini-thumb {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      background: #282828;
    }

    .mini-info {
      flex: 1;
      overflow: hidden;
    }

    .mini-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-artist {
      font-size: 11px;
      color: #a0a0a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24">
        <polygon points="9,6 18,12 9,18"/>
      </svg>
    </div>
    <div class="header-title">YT Music Remote</div>
  </div>

  <!-- Single Status Light at Top -->
  <div class="status-bar" id="statusBar">
    <span class="status-dot red" id="statusDot"></span>
    <span id="statusText">Checking...</span>
  </div>

  <!-- QR Code Card (No URL shown, no Room text) -->
  <div class="qr-card">
    <div class="qr-canvas-wrapper">
      <canvas id="qrCanvas"></canvas>
    </div>
    <div class="qr-hint">Scan with phone camera to connect</div>
  </div>

  <!-- Open YouTube Music Button -->
  <button class="btn-action" id="openYtmBtn" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
    </svg>
    Open YouTube Music
  </button>

  <!-- Now Playing Mini Card -->
  <div class="mini-player" id="miniPlayer">
    <img id="miniThumb" class="mini-thumb" src="" alt="">
    <div class="mini-info">
      <div class="mini-title" id="miniTitle">Song Title</div>
      <div class="mini-artist" id="miniArtist">Artist</div>
    </div>
  </div>

  <script src="qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
